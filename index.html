<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ZDOS Space Command - Prima Z-App</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; height: 100vh; margin: 0; box-sizing: border-box;}
        h1 { text-transform: uppercase; border-bottom: 1px solid #00ff00; text-align: center; }
        
        /* LA TUA UI ZDOS */
        .dashboard { display: flex; gap: 20px; margin-bottom: 20px; width: 100%; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .hud-box { flex: 1; background: #111; border: 2px solid #333; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 0 10px #00ff0022;}
        .hud-value { display: block; font-size: 28px; color: #fff; margin-top: 10px; text-shadow: 0 0 8px #fff; }
        .red-alert { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; color: #ff0000 !important; }

        .container { display: flex; width: 100%; max-width: 1200px; gap: 20px; flex-grow: 1; margin: 0 auto; }
        .panel { flex: 1; display: flex; flex-direction: column; background: #111; border: 1px solid #333; }
        textarea { flex-grow: 1; background: transparent; color: #00ff00; border: none; padding: 15px; font-family: inherit; font-size: 15px; outline: none; }
        pre { flex-grow: 1; margin: 0; padding: 15px; overflow-y: auto; color: #00ffff; }
        button { background: #00ff00; color: #000; border: none; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00cc00; box-shadow: 0 0 15px #00ff00; }
    </style>
</head>
<body>

    <h1>ZDOS Space Command // Z-App Web Engine</h1>

    <!-- I TARGET DEL COSTRUTTO [PAINT] -->
    <div class="dashboard">
        <div class="hud-box">STATO RETE <span id="ui_stato" class="hud-value">OFFLINE</span></div>
        <div class="hud-box">NODI ATTIVI <span id="ui_nodi" class="hud-value">0</span></div>
    </div>

    <div class="container">
        <div class="panel">
            <textarea id="codeInput" spellcheck="false">
[NODE] WebMonitorZDOS {
    [SIGNAL] nodi_attivati = 12
    [SIGNAL] stato_rete = "ONLINE - CRIPTATA"
    [SIGNAL] minaccia_esterna = 0

    [LINK] aggiorna_interfaccia() {
        [EMIT] "Analisi telemetria in corso..."
        
        [IF] minaccia_esterna < 1 {
            [PAINT] "ui_stato" stato_rete
            [PAINT] "ui_nodi" nodi_attivati
        }
        
        [IF] minaccia_esterna > 0 {
            [PAINT] "ui_stato" "ALLARME ROSSO TATTICO"
            [PAINT] "ui_nodi" 0
        }
        [EMIT] "Interfaccia utente renderizzata dal Silicio."
    }
}
            </textarea>
            <button id="runBtn">ESEGUI Z-APP</button>
        </div>
        <div class="panel">
            <pre id="outputTerminal">In attesa di connessione Wasm...</pre>
        </div>
    </div>

    <script type="module">
        import init, { avvia_zlang } from './pkg/zlang_compiler.js';

        async function bootSystem() {
            await init();
            const outputTerminal = document.getElementById('outputTerminal');
            outputTerminal.textContent = "[SYSTEM] Nucleo WebAssembly agganciato.\n";

            document.getElementById('runBtn').addEventListener('click', () => {
                const code = document.getElementById('codeInput').value;
                const result = avvia_zlang(code);
                
                let visibleLog = ">>> ESECUZIONE Z-LANG IN CORSO...\n\n";
                const lines = result.split('\n');

                // IL RADAR: Intercetta i costrutti PAINT dal Runtime Rust
                lines.forEach(line => {
                    if (line.startsWith("@@PAINT:")) {
                        const match = line.match(/@@PAINT:(.*?)=(.*)@@/);
                        if (match) {
                            const element = document.getElementById(match[1]);
                            if (element) {
                                element.textContent = match[2];
                                // Effetti visivi tattici
                                if (match[2].includes("ALLARME")) {
                                    element.parentElement.classList.add("red-alert");
                                    element.classList.add("red-alert");
                                } else {
                                    element.parentElement.classList.remove("red-alert");
                                    element.classList.remove("red-alert");
                                }
                            }
                        }
                    } else if (line.trim() !== "") {
                        visibleLog += line + "\n";
                    }
                });

                outputTerminal.textContent = visibleLog;
            });
        }
        bootSystem();
    </script>
</body>
</html>
